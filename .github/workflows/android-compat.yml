name: Android API 35 Compatibility

on:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

concurrency:
  group: android-api35-compatibility
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x ./gradlew
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run compatibility instrumentation on the Android 15 managed device
        run: >
          ./gradlew api35DebugAndroidTest --no-parallel
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
