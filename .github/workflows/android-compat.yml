name: Android API 35 Compatibility

on:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

concurrency:
  group: android-api35-compatibility
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: chmod +x ./gradlew
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run compatibility instrumentation on the Android 15 managed device
        run: >
          ./gradlew api35DebugAndroidTest --no-parallel
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
