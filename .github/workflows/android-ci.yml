name: Android CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: chmod +x ./gradlew
      - name: Repository gates
        run: |
          python tools/check_localization.py
          python tools/check_branding.py
          python tools/check_consistency.py
          python tools/check_site.py
          python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Android validation
        run: ./gradlew testDebugUnitTest lint check assembleDebug assembleRelease assembleDebugAndroidTest
