name: ReplicaScan Release

# Qualification and verification only. The owner publishes the tag and GitHub Release with
# tools/release_artifact.py (see docs/release.md and ADR 0003); this workflow never creates
# tags or releases, so it cannot race or overwrite a publication.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: replicascan-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  intent:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      artifact: ${{ steps.names.outputs.artifact }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Derive release names from manifest
        id: names
        run: |
          python tools/release_artifact.py names | tee -a "$GITHUB_OUTPUT"
          python tools/check_consistency.py

  validate-build:
    needs: intent
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x ./gradlew
      - name: Validate repository contracts
        run: |
          python tools/check_localization.py
          python tools/check_branding.py
          python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Test and build once
        run: ./gradlew testDebugUnitTest lint check assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Verify APK identity and record candidate metadata
        run: python tools/release_artifact.py prepare --source-sha "$GITHUB_SHA" --out dist
      - name: Upload candidate for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.intent.outputs.tag }}-ci-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

  instrumented-api36:
    needs: intent
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x ./gradlew
      # Without this the emulator falls back to `-accel off` (root cause of the earlier API 36 release failure).
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation on the Android 16 managed device
        run: >
          ./gradlew api36DebugAndroidTest --no-parallel
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Keep instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api36-reports
          path: |
            */build/outputs/androidTest-results/managedDevice/
            */build/reports/androidTests/managedDevice/
          if-no-files-found: warn
          retention-days: 14

  site:
    needs: intent
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate static site
        run: python tools/check_site.py

  security:
    needs: intent
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: java-kotlin
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  verify-published:
    needs: intent
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Tag must match the release manifest
        env:
          EXPECTED: ${{ needs.intent.outputs.tag }}
        run: test "$GITHUB_REF_NAME" = "$EXPECTED"
      - name: Verify the published assets are the qualified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The owner pushes the annotated tag first and uploads assets right after; wait up to 15 min.
          for attempt in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' | grep -qx 3; then
              break
            fi
            sleep 30
          done
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          python tools/release_artifact.py verify --dir release-assets --tag-sha "$GITHUB_SHA" --badging
